<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>42MCP — chat</title>
  <meta name="description" content="Chat to turn any website into an MCP server and API.">
  <meta name="theme-color" content="#0a0b0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="bar__brand">
      <span class="bar__mark">42</span>
      <span class="bar__name">MCP</span>
    </div>
    <button class="bar__status" id="vmPill" type="button" title="Cloud machine">
      <span class="dot" id="vmDot"></span>
      <span id="vmStatusText">…</span>
    </button>
    <button class="bar__icon" id="accountsBtn" type="button" title="Your accounts" aria-label="Your accounts">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 10-5-5 5 5 0 005 5zm0 2c-4 0-9 2-9 5v2h18v-2c0-3-5-5-9-5z"/></svg>
    </button>
    <button class="bar__new" id="newChatBtn" type="button" title="Connect a new site">+ New</button>
  </header>

  <!-- Accounts sheet -->
  <div class="sheet-backdrop" id="accountsSheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Your connected accounts">
      <div class="sheet__head">
        <h2>Your accounts</h2>
        <button class="sheet__close" id="accountsClose" aria-label="Close">✕</button>
      </div>
      <p class="sheet__sub" id="accountsSub">Sites you're signed in to. Open one to use it, or log out.</p>
      <div class="acct-list" id="acctList"></div>
      <button class="btn btn--block" id="accountsAdd">+ Connect another site</button>
    </div>
  </div>

  <main class="chat" id="chat">
    <div class="log" id="log"></div>
  </main>

  <form class="composer" id="composer">
    <div class="composer__field">
      <textarea id="input" rows="1" placeholder="Tell me what to connect — e.g. “my Instagram”" autocomplete="off" enterkeyhint="send"></textarea>
      <button type="submit" class="composer__send" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.99.99 0 00-1.39 1.1L4 11l9 1-9 1-1.99 6.3c-.19.79.61 1.43 1.39 1.1z"/></svg>
      </button>
    </div>
    <p class="composer__hint" id="composerHint">Sign in once, get an MCP server &amp; API — all in this chat.</p>
  </form>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
